# Template: copy this file into the target repository as
# .github/workflows/rdp.yml so the Discord bot can create a temporary
# Windows RDP machine with /rdp create. The workflow:
#   1. enables Remote Desktop on the runner,
#   2. creates a local administrator with a random password,
#   3. opens a Cloudflare quick tunnel (trycloudflare.com — no account, no
#      secret needed) to port 3389,
#   4. publishes Address/Username/Password as the rdp-info-<run_id> artifact
#      (the Discord bot reads this artifact and DMs it to the requester),
#   5. keeps the machine alive until the run is cancelled or GitHub's
#      6-hour hosted-runner cap ends the job.
#   Client side: run "cloudflared access tcp --hostname <address> --url
#   localhost:13389" then RDP to localhost:13389 (cloudflared.exe is free).

name: Windows RDP Machine

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Windows username for the RDP session"
        required: false
        default: "rdpadmin"
      notify_url:
        description: "Optional webhook URL to POST the tunnel hostname to"
        required: false
        default: ""

permissions:
  contents: read
  statuses: write

jobs:
  rdp:
    name: Windows RDP machine
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          # Self-check: wait until something is actually listening on 3389.
          $listening = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            $r = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
            if ($r.TcpTestSucceeded) { $listening = $true; break }
          }
          if (-not $listening) {
            Write-Host "::error::Nothing is listening on RDP port 3389 after enabling Remote Desktop."
            exit 1
          }
          Write-Host "Remote Desktop enabled — listener confirmed on 127.0.0.1:3389."

      - name: Create RDP user with random password
        shell: pwsh
        env:
          RDP_USERNAME_INPUT: ${{ inputs.username }}
        run: |
          # NB: avoid 'runneradmin' — the GitHub runner image ships that
          # account and its password policy blocks a plain reset.
          $username = if ($env:RDP_USERNAME_INPUT) { $env:RDP_USERNAME_INPUT } else { 'rdpadmin' }

          function Get-RandomString {
            param([string]$Pool, [int]$Length)
            $bytes = New-Object byte[] $Length
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            -join ($bytes | ForEach-Object { $Pool[$_ % $Pool.Length] })
          }

          # Complex by construction (upper+lower+digit+special), then shuffled
          # so the character classes are not position-predictable.
          $chars = @()
          $chars += (Get-RandomString -Pool 'ABCDEFGHJKLMNPQRSTUVWXYZ'  -Length 2).ToCharArray()
          $chars += (Get-RandomString -Pool 'abcdefghijkmnpqrstuvwxyz' -Length 10).ToCharArray()
          $chars += (Get-RandomString -Pool '23456789'                 -Length 3).ToCharArray()
          $chars += (Get-RandomString -Pool '!#$%*+-.?@^~'             -Length 1).ToCharArray()
          for ($i = $chars.Length - 1; $i -gt 0; $i--) {
            $j = Get-Random -Maximum ($i + 1)
            $chars[$i], $chars[$j] = $chars[$j], $chars[$i]
          }
          $password = -join $chars

          net user $username $password /add /y
          if ($LASTEXITCODE -ne 0) {
            # If the account already exists, reset its password instead.
            net user $username $password /y
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to create or update the Windows user."
              exit 1
            }
          }
          net localgroup Administrators $username /add
          net localgroup 'Remote Desktop Users' $username /add

          # Hand the credentials to the artifact step; never echo them here.
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_USERNAME=$username"
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASSWORD=$password"
          Write-Host "User $username created (password withheld from logs)."
          Set-Content -Path 'rdp-creds.txt' -Value @(
            "Username: $username",
            "Password: $password"
          )

      - name: Upload credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-creds-${{ github.run_id }}
          path: rdp-creds.txt
          if-no-files-found: error
          retention-days: 1

      - name: Start tunnel, publish info, keep alive
        shell: pwsh
        env:
          NOTIFY_URL: ${{ inputs.notify_url }}
        run: |
          # The tunnel MUST live inside this final step: GitHub's Windows
          # runner kills step-spawned background processes when the step
          # ends, so a tunnel started in an earlier step is dead by the
          # time anyone tries to connect.
          $cf = Join-Path $env:RUNNER_TEMP 'cloudflared.exe'
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cf
          $cfLog = Join-Path $env:RUNNER_TEMP 'cloudflared.log'
          $proc = Start-Process -FilePath $cf `
            -ArgumentList 'tunnel', '--url', 'tcp://127.0.0.1:3389', "--logfile=$cfLog", '--metrics', '127.0.0.1:36500' `
            -WindowStyle Hidden -PassThru

          $hostname = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { break }
            if (Test-Path $cfLog) {
              $match = Select-String -Path $cfLog -Pattern 'https://([a-z0-9-]+\.trycloudflare\.com)' |
                Select-Object -First 1
              if ($match) { $hostname = $match.Matches[0].Groups[1].Value; break }
            }
          }
          if (-not $hostname) {
            Write-Host "=== cloudflared log (last 40 lines) ==="
            if (Test-Path $cfLog) {
              Get-Content $cfLog -Tail 40 | ForEach-Object { Write-Host $_ }
            }
            Write-Host "::error::Could not obtain the quick-tunnel hostname."
            exit 1
          }

          Set-Content -Path 'rdp-info.txt' -Value @(
            "Address:  $hostname",
            "Tunnel:   cloudflare-quick (client: cloudflared access tcp)",
            "Username: $env:RDP_USERNAME",
            "Password: $env:RDP_PASSWORD"
          )

          # Publish the hostname as a commit status so the bot (and anyone
          # with API access) can read it while this run is still in progress.
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'rdp-machine'
          }
          $body = @{
            state       = 'success'
            context     = 'rdp-machine'
            description = "Tunnel: $hostname | User: $env:RDP_USERNAME"
          } | ConvertTo-Json
          try {
            Invoke-RestMethod `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
              -Method Post -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
            Write-Host "Commit status published."
          } catch {
            Write-Host "::warning::Could not publish the commit status: $_"
          }

          # Fallback channel that needs no GitHub permissions at all: POST the
          # hostname to the caller-provided webhook (no secrets in the body).
          if ($env:NOTIFY_URL) {
            try {
              Invoke-RestMethod -Method Post -Uri $env:NOTIFY_URL -ContentType 'text/plain' `
                -Body "rdp-machine`nhost=$hostname`nuser=$env:RDP_USERNAME" | Out-Null
              Write-Host "Notify webhook called."
            } catch {
              Write-Host "::warning::Notify webhook failed: $_"
            }
          }

          Write-Host ""
          Write-Host "================ RDP CONNECTION INFO ================"
          Write-Host "TUNNEL_HOSTNAME=$hostname"
          Write-Host "RDP_USER=$env:RDP_USERNAME"
          Write-Host "====================================================="
          Write-Host "Tunnel ready: $hostname — holding the session."
          $selfTestDone = $false
          while ($true) {
            Start-Sleep -Seconds 60
            if ($env:NOTIFY_URL) {
              $probe = @()
              $probe += "heartbeat=$(Get-Date -Format o)"
              $probe += "cloudflared_alive=$(-not $proc.HasExited)"
              $r = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
              $probe += "rdp_listener=$($r.TcpTestSucceeded)"
              if (-not $selfTestDone -and $hostname) {
                # Decisive self-test: loop through the edge from this same
                # runner (client -> edge -> replica -> origin 3389).
                try {
                  $accessProc = Start-Process -FilePath $cf `
                  -ArgumentList 'access', 'tcp', '--hostname', $hostname, '--url', 'localhost:13400', '--logfile', (Join-Path $env:RUNNER_TEMP 'selftest-access.log') `
                  -WindowStyle Hidden -PassThru
                Start-Sleep -Seconds 10
                try {
                  $tcp = New-Object System.Net.Sockets.TcpClient('127.0.0.1', 13400)
                  $stream = $tcp.GetStream()
                  $cr = New-Object System.Collections.Generic.List[byte]
                  $cr.AddRange([byte[]](3,0,0,43,42,224,0,0,0,0,0))
                  $cr.AddRange([System.Text.Encoding]::ASCII.GetBytes("Cookie: mstshash=selftest`r`n"))
                  $cr.AddRange([byte[]](1,0,8,0,0,0,0,0))
                  $stream.Write($cr.ToArray(), 0, $cr.Count)
                  $stream.ReadTimeout = 15000
                  $buf = New-Object byte[] 64
                  try {
                    $n = $stream.Read($buf, 0, 64)
                    $probe += "selftest=RECV $n bytes: $([BitConverter]::ToString($buf, 0, [Math]::Min($n, 20)))"
                  } catch {
                    $probe += "selftest=READ_FAIL $($_.Exception.Message)"
                  }
                  $tcp.Close()
                } catch {
                  $probe += "selftest=CONNECT_FAIL $($_.Exception.Message)"
                }
                try { $accessProc.Kill() } catch { }
                $selfTestDone = $true
              }
              try {
                $ready = Invoke-WebRequest -Uri 'http://127.0.0.1:36500/ready' -UseBasicParsing -TimeoutSec 5
                $probe += "edge_ready=$($ready.StatusCode) $($ready.Content)"
              } catch {
                $probe += "edge_ready=FAIL $($_.Exception.Message)"
              }
              if (Test-Path $cfLog) { $probe += (Get-Content $cfLog -Tail 25) }
              try {
                Invoke-RestMethod -Method Post -Uri $env:NOTIFY_URL -ContentType 'text/plain' `
                  -Body ($probe -join "`n") | Out-Null
              } catch { }
            }
          }

      - name: Upload connection info artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-info-${{ github.run_id }}
          path: rdp-info.txt
          if-no-files-found: ignore
          retention-days: 1
